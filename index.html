<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hi Service Stock Count</title>
<style>
:root{--green:#159447;--dark:#101714;--muted:#6d7772;--line:#dfe5e1;--bg:#f4f7f5;--white:#fff;--red:#c0392b}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:#17201b}
.wrap{max-width:980px;margin:0 auto;padding:18px}.head{display:flex;align-items:center;gap:14px;margin-bottom:16px}.logo{width:58px;height:58px;border-radius:14px;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:900;font-size:20px}.head h1{margin:0;font-size:24px}.head p{margin:4px 0 0;color:var(--muted);font-size:13px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}.row{display:flex;gap:10px;flex-wrap:wrap}.field{flex:1;min-width:180px}.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}.field input,.field select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer}.btn.primary{background:var(--green);color:white;border-color:var(--green)}.btn.danger{color:var(--red)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.search{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px}
.item{display:grid;grid-template-columns:1.6fr .7fr .7fr auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.item input{width:100%;padding:9px;border:1px solid var(--line);border-radius:7px}.name{font-weight:700}.sub{font-size:11px;color:var(--muted);margin-top:3px}.empty{color:var(--muted);padding:16px;text-align:center}.status{font-size:12px;color:var(--muted);margin-top:8px}.topline{display:flex;justify-content:space-between;gap:8px;align-items:center}.pill{font-size:11px;background:#edf7f1;color:#187443;padding:5px 8px;border-radius:999px;font-weight:700}
@media(max-width:700px){.item{grid-template-columns:1fr 90px 70px}.item .delete{grid-column:1/-1;justify-self:end}.head{align-items:flex-start}.logo{width:48px;height:48px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="logo">HS</div>
    <div><h1>Hi Service Stock Count</h1><p>Main user: André · uses the same Google Apps Script backend</p></div>
  </div>

  <div class="card">
    <div class="topline"><b>Connection</b><span class="pill">Hi Service</span></div>
    <div class="row" style="margin-top:10px">
      <div class="field"><label>Google Apps Script URL</label><input id="scriptUrl" placeholder="https://script.google.com/macros/s/.../exec"></div>
      <div class="field"><label>User</label><input id="user" value="Andre"></div>
    </div>
    <div class="toolbar">
      <button class="btn" id="saveSettings">Save settings</button>
      <button class="btn" id="syncList">Import from Google Sheet</button>
      <button class="btn primary" id="sendCount">Send stock count</button>
    </div>
    <div class="status" id="status">Not connected yet.</div>
  </div>

  <div class="card">
    <div class="topline"><b>Stock list</b><span class="pill" id="countTag">0 items</span></div>
    <div class="toolbar">
      <input class="search" id="search" placeholder="Search stock">
      <button class="btn" id="importCsv">Import CSV</button>
      <input id="csvFile" type="file" accept=".csv,text/csv" hidden>
      <button class="btn" id="addItem">+ Add item</button>
    </div>
    <div id="list"></div>
  </div>
</div>

<script>
const KEY='hiservice-stock-v1';
let state={items:[],url:'',user:'Andre'};
function load(){try{const s=JSON.parse(localStorage.getItem(KEY)||'{}');state={...state,...s};}catch(e){};scriptUrl.value=state.url||'';user.value=state.user||'Andre';render();}
function save(){state.url=scriptUrl.value.trim();state.user=user.value.trim()||'Andre';localStorage.setItem(KEY,JSON.stringify(state));}
function setStatus(t){document.getElementById('status').textContent=t;}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function render(){
 const q=(search.value||'').toLowerCase();const box=document.getElementById('list');
 const rows=state.items.filter(x=>!q||((x.item||'')+' '+(x.category||'')).toLowerCase().includes(q));
 countTag.textContent=state.items.length+' items';
 box.innerHTML=rows.length?rows.map((x,i)=>'<div class="item" data-id="'+x.id+'"><div><div class="name">'+esc(x.item)+'</div><div class="sub">'+esc(x.category||'Other')+' · '+esc(x.unit||'each')+'</div></div><input type="number" min="0" step="1" inputmode="decimal" value="'+esc(x.count??'')+'" placeholder="Qty" data-count><input value="'+esc(x.note||'')+'" placeholder="Note" data-note><button class="btn danger delete">Delete</button></div>').join(''):'<div class="empty">No stock items yet.</div>';
 box.querySelectorAll('.item').forEach(el=>{const id=el.dataset.id,x=state.items.find(a=>a.id===id);el.querySelector('[data-count]').oninput=e=>{x.count=e.target.value;save()};el.querySelector('[data-note]').oninput=e=>{x.note=e.target.value;save()};el.querySelector('.delete').onclick=()=>{if(confirm('Delete this stock item?')){state.items=state.items.filter(a=>a.id!==id);save();render();}}});
}
function addStock(item,category,unit){const name=(item||'').trim();if(!name)return;const exists=state.items.find(x=>x.item.toLowerCase()===name.toLowerCase());if(exists)return;state.items.push({id:'st-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),item:name,category:(category||'Other').trim(),unit:(unit||'each').trim(),count:'',note:''});}
saveSettings.onclick=()=>{save();setStatus('Settings saved on this device.');};
addItem.onclick=()=>{const item=prompt('Item name:');if(!item)return;const category=prompt('Category:','Other')||'Other';const unit=prompt('Unit:','each')||'each';addStock(item,category,unit);save();render();};
search.oninput=render;
importCsv.onclick=()=>csvFile.click();
csvFile.onchange=async()=>{const f=csvFile.files&&csvFile.files[0];if(!f)return;const text=await f.text();const lines=text.split(/\r?\n/).filter(Boolean);for(let i=0;i<lines.length;i++){const cols=lines[i].split(',').map(x=>x.trim().replace(/^"|"$/g,''));if(i===0&&/item|name/i.test(cols[0]))continue;addStock(cols[0],cols[1],cols[2]);}save();render();setStatus('CSV imported.');csvFile.value='';};
async function api(action,payload){
 save();if(!state.url)throw new Error('Add the Google Apps Script URL first.');
 const body={action,app:'Hi Service',division:'Hi Service',user:state.user,...(payload||{})};
 const r=await fetch(state.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});
 const j=await r.json();if(j&&j.ok===false)throw new Error(j.error||'Request failed');return j;
}
syncList.onclick=async()=>{try{setStatus('Importing stock list…');const j=await api('stockList',{source:'Hi Service'});const arr=j.items||j.stock||[];arr.forEach(x=>addStock(x.item||x.name,x.category,x.unit));save();render();setStatus('Imported '+arr.length+' stock items from Google Sheet.');}catch(e){setStatus('Import failed: '+e.message);}};
sendCount.onclick=async()=>{try{const rows=state.items.filter(x=>x.count!==''&&x.count!=null).map(x=>({item:x.item,category:x.category,unit:x.unit,count:Number(x.count),note:x.note||''}));if(!rows.length){alert('Enter at least one stock count.');return;}if(!confirm('Send '+rows.length+' stock counts as '+state.user+'?'))return;setStatus('Sending stock count…');const j=await api('stockCount',{rows,date:new Date().toISOString(),location:'Hi Service'});setStatus('Stock count sent successfully.');}catch(e){setStatus('Send failed: '+e.message);}};
load();
</script>
</body>
</html>
